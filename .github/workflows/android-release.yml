name: Android — Build AAB & Submit to Play Store

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      track:
        description: 'Play Store track to publish to'
        required: true
        default: 'internal'
        type: choice
        options: ['internal', 'alpha', 'beta', 'production']

jobs:
  build-android:
    name: Build & Publish Android AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── Source ──────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Java ─────────────────────────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # ── Node.js ─────────────────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps

      # ── Build web assets with live Railway API URL ───────────────────────────
      - name: Build web assets (native mode)
        env:
          VITE_API_BASE_URL: https://responsible-spontaneity-production.up.railway.app
        run: npm run build

      # ── Sync Capacitor to Android ─────────────────────────────────────────────
      - name: Sync Capacitor → Android
        run: npx cap sync android

      # ── Decode release keystore ──────────────────────────────────────────────
      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode \
            > android/app/roundtable-release.keystore

      # ── Gradle cache ─────────────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      # ── Build signed release AAB ─────────────────────────────────────────────
      - name: Build release AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: roundtable
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=roundtable-release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      # ── Upload AAB artifact ───────────────────────────────────────────────────
      - name: Save AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoundTable-Android-${{ github.sha }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      # ── Submit to Google Play ─────────────────────────────────────────────────
      - name: Publish to Google Play Internal Testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.schilltech.roundtable
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed
          releaseName: "RoundTable ${{ github.run_number }}"
          changesNotSentForReview: false
          whatsNewDirectory: android/app/src/main/play/release-notes
